name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang-tidy

      - name: Install clang-format 18
        run: python -m pip install clang-format==18.1.8

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DRAPID_STATS_WARNINGS_AS_ERRORS=ON
          -DRAPID_STATS_ENABLE_SANITIZERS=ON

      - name: Check formatting
        run: cmake --build build --target format-check

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Clang-tidy
        run: cmake --build build --target tidy
