name: ci

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^[A-Z]+-[0-9]+ \| .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request title must start with the task id."
            echo "Expected: QUI-1 | example_title"
            echo "Actual:   $PR_TITLE"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang-tidy

      - name: Install clang-format 18
        run: python -m pip install clang-format==18.1.8

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Check formatting
        run: cmake --build build --target format-check

      - name: Build
        run: cmake --build build

      - name: Clang-tidy
        run: cmake --build build --target tidy
